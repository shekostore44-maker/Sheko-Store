<!-- Supabase → Authentication → Emails → "Confirm signup"
     Subject: أكّد حسابك في Sheko -->
<div dir="rtl" style="font-family: Tahoma, Arial, sans-serif; background: #f4f7fc; padding: 32px 16px">
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px; text-align: center">
    <h1 style="color: #0e1a36; font-size: 22px; margin: 0 0 12px">أهلاً بيك في Sheko 👋</h1>
    <p style="color: #4a5878; font-size: 15px; line-height: 1.8; margin: 0 0 24px">
      فاضل خطوة واحدة. اضغط على الزرار عشان تأكد بريدك وحسابك يتفعّل.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/account"
       style="display: inline-block; background: #0e1a36; color: #f4f7fc; text-decoration: none; font-weight: bold; padding: 14px 32px; border-radius: 12px">
      تأكيد الحساب
    </a>
    <p style="color: #8a97b5; font-size: 12px; line-height: 1.7; margin: 24px 0 0">
      لو مش إنت اللي عملت الحساب ده، تجاهل الرسالة.
    </p>
  </div>
</div>
